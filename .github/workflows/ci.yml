name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài đặt phụ thuộc
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu
        run: npm run typecheck

      - name: Kiểm tra quy chuẩn mã nguồn
        run: npm run lint

      - name: Chạy kiểm thử tự động
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/test
