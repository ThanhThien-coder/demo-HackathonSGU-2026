<!doctype html>
<!--
  Bản vẽ tham chiếu của D-81. Đặc tả chính thức là docs/spec/30_UI.md.
  - Ô chọn bậc người học chỉ để thử gợi ý theo bậc. Giao diện thật không có ô này (D-81).
  - Chưa có popover giải thích đoạn chọn (D-82, spec 30 UI-34).
  - Cách chia nhóm chỉ để minh họa. Engine gom theo thực thể, shop-api ra 4 nhóm (spec 11 T-ENG-48).
  - Nút "Học lại" chỉ để thử lại bản vẽ. Bài chưa đạt không có ôn tập (D-35).
-->
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpliFey — Bản vẽ thử giao diện học code</title>
<style>
html[data-theme="dark"]{
  --bg:#0e1319; --panel:#161c25; --panel2:#1d2531; --border:#2a3443; --text:#e7edf5; --muted:#93a0b2;
  --accent:#5aa9ff; --on-accent:#06121f;
  --ready:#f2b53c; --done:#46c28a; --fail:#f0605f; --locked:#7b8696;
  --code-bg:#0b1016; --code-text:#d6deea; --kw:#ff8f85; --str:#9fd0ff; --gutter:#5f6c80;
  --hl-step:rgba(90,169,255,.16); --hl-focus:rgba(242,181,60,.26); --hl-good:rgba(70,194,138,.22); --hl-bad:rgba(240,96,95,.24);
  --shadow:0 10px 30px rgba(0,0,0,.5); --overlay:rgba(3,6,10,.62);
}
html[data-theme="light"]{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#eef1f6; --border:#d3dae5; --text:#18212d; --muted:#586577;
  --accent:#1769e0; --on-accent:#ffffff;
  --ready:#a86a00; --done:#17794a; --fail:#c62f31; --locked:#6a7586;
  --code-bg:#f8f9fb; --code-text:#1f2733; --kw:#c4261f; --str:#0b4f9e; --gutter:#8a95a6;
  --hl-step:rgba(23,105,224,.12); --hl-focus:rgba(168,106,0,.22); --hl-good:rgba(23,121,74,.18); --hl-bad:rgba(198,47,49,.17);
  --shadow:0 10px 30px rgba(20,30,50,.18); --overlay:rgba(20,28,40,.4);
}
:root{ --mono:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;transition:background .2s,color .2s}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--panel2);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* thanh trên */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.brand{font-weight:700;letter-spacing:.2px}
.repo{font-family:var(--mono);font-size:13px;padding:2px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel2)}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;transition:background .15s,border-color .15s}
.tbtn:hover{background:var(--panel2)}
.tbtn[aria-pressed="false"]{opacity:.6}
.tbtn.icon{padding:5px 7px}

/* bố cục */
.main{padding:12px;gap:12px}
.col{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-width:0}
@media (min-width:1024px){
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
  .col{min-height:0;overflow:auto}
  .col-mid{overflow:hidden}
}
@media (max-width:1023.98px){
  .main{display:flex;flex-direction:column}
  .col-mid{position:sticky;top:0;z-index:5;height:min(430px,52vh);overflow:hidden}
  .top .brand{display:none}
}
.pane{padding:14px 14px 18px}
.pane-title{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* bản đồ */
.grp{margin-bottom:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);overflow:hidden}
.grp-h{width:100%;display:flex;align-items:center;gap:8px;background:var(--panel2);border:0;padding:9px 10px;text-align:left}
.grp-h .chev{display:inline-block;transition:transform .18s;color:var(--muted)}
.grp-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.gname{font-weight:600}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--ready);color:var(--ready)}
.cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.grp-b{padding:8px;display:grid;gap:8px}
.slice{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 11px;transition:border-color .15s,background .15s,transform .15s}
.slice:hover{border-color:var(--muted)}
.slice.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slice[aria-disabled="true"]{opacity:.68}
.s-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.s-name{font-size:15px;font-weight:600}
.star{color:var(--ready)}
.ai-tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.s-code{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.s-st{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.st-ready .s-st{color:var(--ready)} .st-done .s-st{color:var(--done)} .st-fail .s-st{color:var(--fail)} .st-locked .s-st{color:var(--locked)}
.st-done{border-color:var(--done)} .st-fail{border-color:var(--fail)}
.slice svg{flex:none}
.need{display:none;margin-top:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--border);padding-top:5px}
.slice:hover .need,.slice:focus-visible .need{display:block}
.pop-fx{animation:pop .7s ease}

/* khung giữa */
.mid-frame{display:flex;flex-direction:column;height:100%;min-height:0}
.ftabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.ftab{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;border-right:1px solid var(--border);border-bottom:2px solid transparent;padding:9px 14px;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:color .15s,background .15s}
.ftab:hover{color:var(--text)}
.ftab[aria-selected="true"]{background:var(--code-bg);color:var(--text);border-bottom-color:var(--accent)}
.weak-dot{width:7px;height:7px;border-radius:50%;background:var(--fail)}
.fpath{padding:5px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--code-bg);border-bottom:1px solid var(--border);flex:none}
.code-scroll{position:relative;flex:1;min-height:0;overflow:auto;background:var(--code-bg);color:var(--code-text);padding:8px 0}
.ln{display:flex;border-left:3px solid transparent;font-family:var(--mono);font-size:13px;line-height:1.75;white-space:pre;min-width:max-content}
.ln .no{flex:none;width:52px;padding-right:14px;text-align:right;color:var(--gutter);user-select:none}
.ln .tx{padding-right:16px}
.ln .k{color:var(--kw)} .ln .s{color:var(--str)}
.ln.hl-step{background:var(--hl-step);border-left-color:var(--accent);animation:hlIn .22s ease}
.ln.hl-focus{background:var(--hl-focus);border-left-color:var(--ready);animation:hlIn .22s ease}
.ln.hl-good{background:var(--hl-good);border-left-color:var(--done);animation:hlIn .22s ease}
.ln.hl-bad{background:var(--hl-bad);border-left-color:var(--fail);animation:hlIn .22s ease}
.gap{font-family:var(--mono);font-size:12px;color:var(--gutter);padding:2px 0 2px 55px;font-style:italic}

/* bức tranh chung */
.overview{padding:22px;max-width:640px}
.overview h2{font-size:20px;margin-bottom:8px}
.overview .lead{color:var(--text);margin-bottom:16px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.gcard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.gcard b{display:block;margin-bottom:2px}
.gcard small{color:var(--muted);display:block}
.ov-wrap{height:100%;overflow:auto}
.empty{padding:24px 18px;color:var(--muted)}
.empty h2{font-size:16px;color:var(--text);margin-bottom:6px}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.big{padding:11px 18px;font-size:15px;width:100%}
.btn.small{padding:3px 10px;font-size:12.5px}

/* cột phải */
.rtabs{position:sticky;top:0;z-index:3;display:flex;background:var(--panel);border-bottom:1px solid var(--border);padding:0 8px}
.rtab{background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 14px;font-weight:600;color:var(--muted);transition:color .15s}
.rtab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.rtab:hover{color:var(--text)}
.stack{display:grid;gap:12px}
.enter .stack{animation:fadeUp .2s ease}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card h2{font-size:16px;margin-bottom:6px}
.card p+p{margin-top:4px}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--border);border-radius:999px;padding:0 8px;margin-left:2px;color:var(--muted)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--hl-focus);border:1px solid var(--ready);border-radius:10px;padding:8px 12px;font-size:13px}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stephead h2{font-size:15px}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--border);transition:background .2s}
.dots i.on{background:var(--accent)}
.where{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.expl{font-size:15px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--hl-step);border:1px solid var(--accent);color:var(--text);border-radius:999px;padding:3px 12px;font-size:13px;transition:background .15s}
.chip:hover{background:var(--accent);color:var(--on-accent)}
.navrow{display:flex;gap:10px;justify-content:space-between}
.keyhint{font-size:12px;color:var(--muted)}
.sum-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sum-title.good{color:var(--done)} .sum-title.bad{color:var(--fail)}
.sum-item{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;transition:background .15s}
.sum-item:hover{background:var(--panel)}
.sum-item.good{border-left-color:var(--done)} .sum-item.bad{border-left-color:var(--fail)}
.sum-item small{display:block;color:var(--muted);font-size:12px}
.cons{margin:-2px 0 8px;padding:8px 12px;border-radius:8px;background:var(--hl-bad);font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline;margin-bottom:8px}

/* Feynman */
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--border);padding:7px 6px;font-size:13px;color:var(--muted);transition:background .15s}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px;display:block}
.qchips{display:flex;gap:8px}
.qchip{min-width:46px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 14px;font-size:15px;transition:border-color .15s}
.qchip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.qchip.ok{color:var(--done);border-color:var(--done)} .qchip.no{color:var(--fail);border-color:var(--fail)}
.qchip:disabled{opacity:.45}
.qtext{font-size:15.5px;line-height:1.6;font-weight:600}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit;line-height:1.55}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.subrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--fail);font-size:12.5px;margin-top:6px}
.att{border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:6px 10px}
.att summary{cursor:pointer;font-weight:600;font-size:13px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:999px;border:1px solid currentColor;margin-left:6px}
.pill.ok{color:var(--done)} .pill.no{color:var(--fail)}
.said{margin:6px 0;padding:6px 10px;border-left:3px solid var(--border);color:var(--muted);white-space:pre-wrap}
.fb{margin:4px 0}
.hint{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--hl-focus);font-size:13.5px}
.hint-act{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sample{padding:10px 12px;border-radius:8px;border:1px dashed var(--done);background:var(--hl-good)}
.sample b{display:block;font-size:12px;margin-bottom:2px}
.delta{animation:fadeUp .25s ease}
.delta .dname{font-size:13.5px;margin-bottom:5px}
.bar{position:relative;height:10px;border-radius:5px;background:var(--border);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;display:block}
.bar .base{background:var(--accent);width:var(--base)}
.bar .diff{left:var(--base);width:var(--diff);animation:grow .7s ease-out}
.bar .diff.up{background:var(--done)} .bar .diff.down{background:var(--fail)}
.result{border-radius:10px;padding:12px 14px;border:1px solid;animation:fadeUp .25s ease}
.result.done{border-color:var(--done);background:var(--hl-good)}
.result.fail{border-color:var(--fail);background:var(--hl-bad)}
.result h3{font-size:15px;margin-bottom:4px}
.result ul{margin:6px 0 0;padding-left:18px}

/* popover & modal & toast */
.pop{position:fixed;z-index:60;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;animation:fadeUp .18s ease}
.pop h3{font-size:16px;padding-right:28px}
.pop h3 code{font-size:11px;color:var(--muted);margin-left:4px}
.pop dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}
.pop dd{margin:2px 0 0}
.pop hr{border:0;border-top:1px solid var(--border);margin:12px 0 10px}
.pop .ai b{color:var(--accent)}
.xbtn{position:absolute;top:8px;right:8px;background:transparent;border:0;width:28px;height:28px;border-radius:6px;color:var(--muted)}
.xbtn:hover{background:var(--panel2);color:var(--text)}
.overlay{position:fixed;inset:0;z-index:80;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease}
.modal{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100vh - 32px);overflow:auto;animation:fadeUp .2s ease}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:90;max-width:min(520px,calc(100vw - 24px));background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:13.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes hlIn{from{background-color:transparent}}
@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.03);box-shadow:0 0 0 4px var(--hl-good)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="tbtn icon" id="btnLeft" data-act="toggle-left" aria-label="Ẩn hoặc hiện bản đồ bài học" aria-pressed="true" title="Ẩn/hiện bản đồ bài học">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="3" width="4" height="10" fill="currentColor" opacity=".75"/></svg>
  </button>
  <span class="brand">SimpliFey</span>
  <span class="repo" aria-label="Repo đang học">shop-api</span>
  <button class="tbtn" data-act="overview">Tổng quan</button>
  <span class="spacer"></span>
  <button class="tbtn" id="btnTheme" data-act="theme" aria-label="Đổi chủ đề sáng hoặc tối"></button>
  <button class="tbtn icon" id="btnRight" data-act="toggle-right" aria-label="Ẩn hoặc hiện cột X-Ray và Feynman" aria-pressed="true" title="Ẩn/hiện X-Ray và Feynman">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="10" y="3" width="4" height="10" fill="currentColor" opacity=".75"/></svg>
  </button>
</header>

<main class="main" id="main">
  <aside class="col col-left" id="colLeft" aria-label="Bản đồ bài học"><div class="pane" id="map"></div></aside>
  <section class="col col-mid" id="colMid" aria-label="Khung code"><div id="mid" style="height:100%"></div></section>
  <aside class="col col-right" id="colRight" aria-label="X-Ray và Feynman"><div id="right"></div></aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ============ tiện ích ============ */
var $ = function(s){ return document.querySelector(s); };
var ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; }); }
function md(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function rng(a,b){ return a===b ? 'dòng '+a : 'dòng '+a+'–'+b; }
var TOK = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(async|await|const|let|var|for|of|return|new|this|function|if|else|import|export)\b/g;
function synt(line){
  var out='', last=0, m; TOK.lastIndex=0;
  while((m = TOK.exec(line))){
    out += esc(line.slice(last, m.index));
    out += m[1] ? '<span class="s">'+esc(m[1])+'</span>' : '<span class="k">'+esc(m[2])+'</span>';
    last = TOK.lastIndex;
  }
  return out + esc(line.slice(last));
}

/* ============ dữ liệu giả ============ */
var PID = 'slice-product-list';
var SLICES = {
  'slice-register': {vi:'Đăng ký', code:'POST /register · Register User', req:[]},
  'slice-profile': {vi:'Hồ sơ người dùng', code:'GET /me · Get Profile', req:['slice-register']},
  'slice-product-list': {vi:'Xem danh sách sản phẩm', code:'GET /products · List Products', req:[]},
  'slice-cart': {vi:'Giỏ hàng', code:'POST /cart/items · Add To Cart', req:['slice-profile']},

      return '<button class="qchip'+cls+'" data-act="qsel" data-i="'+i+'" aria-label="'+lab+'"'+(i===S.qi?' aria-current="true"':'')+(dis?' disabled':'')+'>'+['①','②'][i]+(d.done?(d.passed?' ✓':' ✗'):'')+'</button>';
    }).join('')+'</div></div>';
  h+='<div class="card"><span class="lbl">Câu '+(S.qi+1)+'/2 · '+esc(Q.kind)+'</span><p class="qtext">'+esc(Q.text)+'</p></div>';
  if(q.attempts.length){
    h+='<div class="stack" style="gap:8px">'+q.attempts.map(function(a,k){
      var last=k===q.attempts.length-1;
      return '<details class="att"'+(last?' open':'')+'><summary>Lượt '+(k+1)+' <span class="pill '+(a.pass?'ok':'no')+'">'+(a.pass?'Đạt':'Chưa đạt')+'</span></summary>'
        +'<div class="said">'+esc(a.text)+'</div><p class="fb">'+esc(a.fb)+'</p>'+hintHTML(a,last,S.qi)+'</details>';
    }).join('')+'</div>';
  }
  if(!q.done){
    h+='<div><label class="lbl" for="ans">Câu trả lời của bạn</label>'
      +'<textarea id="ans" rows="5" placeholder="Viết bằng lời của bạn…">'+esc(q.draft)+'</textarea>'
      +'<p class="err" id="ansErr" role="alert" hidden>Hãy viết vài câu trước khi nộp.</p>'
      +'<div class="subrow"><button class="btn primary" data-act="submit">Nộp câu trả lời</button>'
      +'<span class="muted">Lượt '+(q.attempts.length+1)+'/3</span><span class="keyhint">Ctrl+Enter để nộp</span></div></div>';
  }else{
    h+='<div class="sample"><b>Đáp án mẫu</b>'+esc(Q.sample)+'</div>'+deltaHTML(q,S.qi);
    if(S.qi<QS.length-1) h+='<button class="btn primary big" data-act="qsel" data-i="'+(S.qi+1)+'">Sang câu ② →</button>';
  }
  if(res){
    var info = res==='done' ? unlockInfo(id) : [];
    h+='<div class="result '+res+'" role="status">'
      +(res==='done'
        ? '<h3>✓ Đã xong bài “'+esc(SLICES[id].vi)+'”</h3><p>Cả 2 câu đều đạt.</p>'
        : '<h3>✗ Chưa đạt bài “'+esc(SLICES[id].vi)+'”</h3><p>Có câu chưa đạt. Bạn có thể học lại từ đầu.</p>')
      +(info.length?'<ul>'+info.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>':'')
      +(res==='fail'?'<div class="subrow"><button class="btn primary" data-act="relearn">Học lại</button></div>':'')+'</div>';
  }
  return h+'</div>';
}

/* ============ chấm giả ============ */
function evaluate(qi, text){
  var t=text.toLowerCase().normalize('NFC');
  if(qi===0){
    var g=[/listproducts|service/.test(t), /vòng|từng sản phẩm|\bfor\b/.test(t), /findbyid|database|\bdb\b/.test(t)];
    var n=g.filter(Boolean).length;
    if(n>=2) return {pass:true, fb:"Đạt! Bạn đã nêu được các bước yêu cầu đi qua và việc mỗi bước làm."};
    if(g[0]) return {pass:false, fb:"Bạn đã nhắc đến tầng xử lý nghiệp vụ — đúng hướng, nhưng còn thiếu các bước còn lại."};
    if(g[1]) return {pass:false, fb:"Bạn đã để ý việc lặp qua từng sản phẩm — đúng ý, nhưng chưa đủ luồng đi."};
    if(g[2]) return {pass:false, fb:"Bạn đã nhắc đến việc hỏi database — đúng ý, nhưng chưa rõ yêu cầu đi qua những bước nào."};
    return {pass:false, fb:"Chưa thấy ý chính. Hãy thử kể theo thứ tự từ lúc yêu cầu vào đến lúc có dữ liệu."};
  }
  if(/(^|[^\d])201([^\d]|$)/.test(t)) return {pass:true, fb:"Chính xác! Bạn đã đếm đúng số lần hỏi database."};
  if(/\d/.test(t)) return {pass:false, fb:"Bạn đã tính ra một con số, nhưng chưa khớp với những gì code làm."};
  if(/findbyid|vòng|từng|mỗi|database|\bdb\b/.test(t)) return {pass:false, fb:"Bạn đã nhận ra việc hỏi database lặp lại — đúng ý, nhưng hãy tính ra con số cụ thể."};
  return {pass:false, fb:"Chưa thấy con số cụ thể. Hãy thử đếm số lần hỏi database."};
}

/* ============ hành động ============ */
function setHl(file, list){ S.fileIdx=file; S.hl=list; }
function stepRange(i){ var s=LESSON.steps[i]; return {file:s.file, from:s.from, to:s.to, cls:'step'}; }
function goRole(){ S.stage='role'; S.fileIdx=0; S.hl=[]; wantPanelFocus=true; render({resetRight:true}); }
function goStep(i, fromHint){
  S.rightTab='xray'; S.stage='tour'; S.step=i;
  setHl(LESSON.steps[i].file, [stepRange(i)]);
  if(fromHint) S.returnQ=true;
  wantPanelFocus=true;
  render({resetRight:true});
}
function goSummary(){ S.stage='summary'; S.hl=[]; wantPanelFocus=true; render({resetRight:true}); }
function nav(dir){
  if(S.stage==='role'){ if(dir>0) goStep(0); return; }
  if(S.stage==='tour'){
    if(dir>0){ S.step<LESSON.steps.length-1 ? goStep(S.step+1) : goSummary(); }
    else { S.step>0 ? goStep(S.step-1) : goRole(); }
    return;
  }
  if(dir<0) goStep(LESSON.steps.length-1);
}
function openSlice(id){
  var st=status(id);
  if(st==='locked'){ toast('Cần xong: '+names(missing(id))); return; }
  if(id!==PID){ toast('Bản vẽ chỉ có dữ liệu cho bài Xem danh sách sản phẩm'); return; }
  if(S.selected!==id){
    S.selected=id; S.rightTab='xray'; S.stage='role'; S.step=0; S.fileIdx=0; S.hl=[]; S.returnQ=false;
    wantPanelFocus=true;
    render({resetRight:true});
  }
}
function finishCheck(){
  if(S.q.every(function(q){ return q.done; }) && !S.results[S.selected]){
    var ok=S.q.every(function(q){ return q.passed; });
    S.results[S.selected]= ok ? 'done' : 'fail';
    S.fx[S.selected]=true;
    if(ok){
      var info=unlockInfo(S.selected);
      toast('Bài đã xong! '+info.join(' · '));
    }else toast('Bài chưa đạt. Bạn có thể bấm “Học lại”.');
  }
}
function submit(){
  var q=S.q[S.qi]; if(q.done) return;
  var ta=$('#ans'); if(!ta) return;
  var text=ta.value.trim(); q.draft=ta.value;
  if(!text){ var e=$('#ansErr'); if(e) e.hidden=false; ta.focus(); return; }
  var ev=evaluate(S.qi, text), n=q.attempts.length+1;
  var att={text:text, pass:ev.pass, fb:ev.fb, hint:null};
  if(ev.pass){ q.done=true; q.passed=true; }
  else if(n>=3){ q.done=true; q.passed=false; }
  else att.hint=HINTS[S.level][n-1];
  q.attempts.push(att); q.draft='';
  finishCheck();
  wantAnsFocus=!q.done;
  render();
}

var HANDLERS = {
  'toggle-left':function(){ S.leftOpen=!S.leftOpen; render(); },
  'toggle-right':function(){ S.rightOpen=!S.rightOpen; render(); },
  'theme':function(){ S.theme = S.theme==='dark' ? 'light' : 'dark'; try{ localStorage.setItem('sf-theme', S.theme); }catch(e){} render(); },
  'overview':function(t){ openModal(t); },
  'modal-close':function(){ closeModal(); },
  'modal-bg':function(t,e){ if(e.target===t) closeModal(); },
  'start-with':function(){ if(S.modal) closeModal(); S.openGroups.buy=true; openSlice(PID); },
  'grp':function(t){ S.openGroups[t.dataset.id]=!S.openGroups[t.dataset.id]; render(); },
  'slice':function(t){ openSlice(t.dataset.id); },
  'tab':function(t){ S.rightTab=t.dataset.id; if(S.rightTab==='feynman') S.returnQ=false; render({resetRight:true}); },
  'file':function(t){
    var i=+t.dataset.i;
    var si=LESSON.steps.findIndex(function(s){ return s.file===i; });
    if(S.rightTab==='xray') goStep(si);
    else { setHl(i, [stepRange(si)]); render(); }
  },
  'next':function(){ nav(1); },
  'prev':function(){ nav(-1); },
  'skill':function(t){
    if(S.popover===t.dataset.skill){ closePopover(true); return; }
    openPopover(t.dataset.skill, t);
  },
  'pop-close':function(){ closePopover(true); },
  'see-line':function(){
    var k=S.popover; if(!k) return;
    var sk=SKILLS[k];
    setHl(LESSON.steps[sk.step].file, [stepRange(sk.step), {file:LESSON.steps[sk.step].file, from:sk.line, to:sk.line, cls:'focus'}]);
    closePopover(false); render();
  },
  'sum':function(t){
    var it=LESSON[t.dataset.id];
    setHl(it.file, [{file:it.file, from:it.from, to:it.to, cls:t.dataset.id}]);
    render();
  },
  'more-bad':function(){ S.expandBad=!S.expandBad; render(); },
  'to-feynman':function(){ S.rightTab='feynman'; S.returnQ=false; wantAnsFocus=!S.q[S.qi].done; wantPanelFocus=true; render({resetRight:true}); },
  'level':function(t){ S.level=t.dataset.id; render(); },
  'qsel':function(t){ S.qi=+t.dataset.i; wantAnsFocus=!S.q[S.qi].done; wantPanelFocus=true; render({resetRight:true}); },
  'submit':function(){ submit(); },
  'open-step':function(t){ goStep(+t.dataset.i, true); },
  'back-q':function(){ S.rightTab='feynman'; S.returnQ=false; wantAnsFocus=!S.q[S.qi].done; wantPanelFocus=true; render({resetRight:true}); },
  'relearn':function(){
    delete S.results[S.selected]; S.q=[newQ(), newQ()]; S.qi=0;
    S.rightTab='xray'; S.stage='role'; S.step=0; S.fileIdx=0; S.hl=[]; S.returnQ=false; S.expandBad=false;
    wantPanelFocus=true; render({resetRight:true}); toast('Đã đặt lại bài, bạn học lại từ đầu.');
  }
};

/* ============ popover ============ */
function openPopover(key, anchor){
  closePopover(false);
  var sk=SKILLS[key]; S.popover=key; lastAnchor=anchor;
  var el=document.createElement('div');
  el.className='pop'; el.id='pop'; el.setAttribute('role','dialog'); el.tabIndex=-1;
  el.setAttribute('aria-label','Thẻ khái niệm: '+sk.title);
  el.innerHTML='<button class="xbtn" data-act="pop-close" aria-label="Đóng thẻ khái niệm">✕</button>'
    +'<h3>'+esc(sk.title)+' <code>'+key+'</code></h3>'
    +'<dl><dt>Là gì</dt><dd>'+md(sk.what)+'</dd><dt>Ví dụ đời thường</dt><dd>'+md(sk.eg)+'</dd><dt>Vì sao quan trọng</dt><dd>'+md(sk.why)+'</dd></dl>'
    +'<hr><div class="ai"><b>Trong repo này (AI):</b> '+md(sk.repo)
    +'<div class="hint-act"><button class="btn small" data-act="see-line">Xem dòng</button></div></div>';
  document.body.appendChild(el);
  var r=anchor.getBoundingClientRect(), w=el.offsetWidth, hgt=el.offsetHeight;
  var left=Math.min(Math.max(12, r.left), window.innerWidth-w-12);
  var top=r.bottom+8;
  if(top+hgt > window.innerHeight-12) top = (r.top-hgt-8 >= 12) ? r.top-hgt-8 : Math.max(12, window.innerHeight-hgt-12);
  el.style.left=left+'px'; el.style.top=top+'px';
  el.focus({preventScroll:true});
}
function closePopover(refocus){
  var el=document.getElementById('pop');
  if(el) el.remove();
  S.popover=null;
  if(refocus && lastAnchor && document.body.contains(lastAnchor)) lastAnchor.focus({preventScroll:true});
}

/* ============ cửa sổ nổi ============ */
function openModal(opener){
  if(S.modal) return;
  S.modal=true; modalPrev=opener||document.activeElement;
  $('#modalRoot').innerHTML='<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">'
    +'<button class="xbtn" data-act="modal-close" aria-label="Đóng cửa sổ tổng quan">✕</button>'+overviewInner('mTitle')+'</div></div>';
  $('#modalRoot .modal').focus();
}
function closeModal(){
  S.modal=false; $('#modalRoot').innerHTML='';
  if(modalPrev && document.body.contains(modalPrev)) modalPrev.focus({preventScroll:true});
}

/* ============ sự kiện ============ */
document.addEventListener('click', function(e){
  var pop=document.getElementById('pop');
  if(pop && !pop.contains(e.target) && !e.target.closest('[data-act="skill"]')) closePopover(false);
  var t=e.target.closest('[data-act]'); if(!t) return;
  var h=HANDLERS[t.dataset.act]; if(h) h(t, e);
});
document.addEventListener('input', function(e){
  if(e.target.id==='ans'){ S.q[S.qi].draft=e.target.value; var er=$('#ansErr'); if(er) er.hidden=true; }
});
window.addEventListener('scroll', function(e){
  var pop=document.getElementById('pop');
  if(pop && !(e.target.nodeType===1 && pop.contains(e.target))) closePopover(false);
}, true);
window.addEventListener('resize', function(){ closePopover(false); });

document.addEventListener('keydown', function(e){
  var t=e.target;
  if(e.key==='Escape'){
    if(S.popover){ closePopover(true); e.preventDefault(); return; }
    if(S.modal){ closeModal(); e.preventDefault(); return; }
  }
  if(e.key==='Tab' && S.modal){
    var f=[].slice.call(document.querySelectorAll('#modalRoot button, #modalRoot [href], #modalRoot [tabindex]:not([tabindex="-1"])'));
    if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey && (t===first || t.classList.contains('modal'))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && t===last){ e.preventDefault(); first.focus(); }
    return;
  }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && t.id==='ans'){ e.preventDefault(); submit(); return; }
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  var grp = t.closest && t.closest('[role="tablist"],[role="radiogroup"]');
  if(grp && /^(tab|radio)$/.test(t.getAttribute('role')||'')){
    var items=[].slice.call(grp.querySelectorAll('[role="'+t.getAttribute('role')+'"]:not(:disabled)'));
    var idx=items.indexOf(t); if(idx<0) return;
    var nx=items[(idx+(e.key==='ArrowRight'?1:-1)+items.length)%items.length];
    e.preventDefault(); nx.focus(); nx.click();
    return;
  }
  if(S.selected && S.rightTab==='xray' && !S.modal){
    if(t.matches && t.matches('input,textarea,select,[contenteditable="true"]')) return;
    e.preventDefault(); nav(e.key==='ArrowRight' ? 1 : -1);
  }
});

/* ============ khởi động ============ */
try{ var saved=localStorage.getItem('sf-theme'); if(saved==='light'||saved==='dark') S.theme=saved; }catch(e){}
render();
})();
</script>
